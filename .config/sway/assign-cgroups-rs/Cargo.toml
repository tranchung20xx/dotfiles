[package]
name = "assign-cgroups"
version = "0.1.0"
edition = "2021"
description = "Assign a dedicated systemd scope to GUI apps launched in the compositor's cgroup (i3/sway)"

[[bin]]
name = "assign-cgroups"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
zbus = { version = "3", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "=4.4.18", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
libc = "0.2"
once_cell = "1"
x11rb = { version = "0.13", features = ["res"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
